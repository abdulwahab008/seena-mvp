name: CI

on:
  pull_request:
    paths:
      - 'apps/academy/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/academy/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy:
    name: academy — typecheck, unit, db, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Start local Supabase and apply migrations
        working-directory: apps/academy
        run: |
          supabase start
          supabase db reset

      # Local dev keys are fixed, non-secret demo values generated by the
      # Supabase CLI for this project's own supabase/config.toml — never
      # real credentials. `status -o env` names them ANON_KEY/SERVICE_
      # ROLE_KEY/API_URL; renamed here (line start only) to match what
      # this app's own code reads, same as a developer's local .env.local.
      - name: Write local env
        working-directory: apps/academy
        run: |
          supabase status -o env \
            | sed -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' \
                  -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            > .env.local
          echo "ADMIN_SETUP_TOKEN=ci-$(openssl rand -hex 12)" >> .env.local
          echo "COMM_WEBHOOK_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          echo "PAY_SECRET_JAZZCASH=ci-$(openssl rand -hex 16)" >> .env.local
          echo "EXPORT_WORKER_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          echo "TRANSPORT_GPS_WEBHOOK_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          echo "EXAM_PAPER_CALLBACK_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          # A non-empty key makes the password-reset flow attempt a send (which fails neutrally with no network); unset it reports "not configured".
          echo "RESEND_API_KEY=ci-dummy-not-a-credential" >> .env.local

      - name: Typecheck
        working-directory: apps/academy
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        working-directory: apps/academy
        run: pnpm run test

      - name: Database tests (pgTAP)
        working-directory: apps/academy
        run: pnpm run db:test

      - name: Install Playwright browsers
        working-directory: apps/academy
        run: npx playwright install --with-deps chromium

      # --workers=2: this suite is proven to produce mass spurious sign-in
      # failures under default (CPU-count) parallelism against a single
      # local Postgres/GoTrue pair — see e2e/*.spec.ts and this repo's own
      # dev notes. Not a CI-specific workaround; the same limit applies
      # locally.
      - name: End-to-end tests
        working-directory: apps/academy
        run: pnpm run test:e2e -- --workers=2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/academy/playwright-report/
          retention-days: 7
